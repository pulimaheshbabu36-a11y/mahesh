services:
  - type: web
    name: ai-csv-report-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_DATA_DIR
        value: /tmp/ai-csv-report-data
      - key: OPENAI_API_KEY
        sync: false
